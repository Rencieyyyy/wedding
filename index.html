<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harold & Myca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Leaf Curtain Overlay (Covers the screen when tapped) -->
  <div class="leaf-curtain" id="leaf-curtain">
    <div class="curtain-backdrop"></div>
    <!-- individual leaves are injected here by script.js -->
  </div>

  <div class="screen" id="screen">

    <!-- Top Left Winding Vine & Stem -->
    <div class="stem-container stem-top-left">
      <svg viewBox="0 0 160 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M-10 -10 C 20 40, 40 90, 30 140 C 25 165, 55 185, 90 190" stroke="var(--espresso)" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
        <path d="M30 85 C 60 70, 90 80, 115 65" stroke="var(--espresso)" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>

        <g class="dancing-leaf leaf-1">
          <path d="M30 140 C 5 130, -5 105, 10 90 C 25 110, 28 130, 30 140" fill="var(--cocoa)" opacity="0.35"/>
          <path d="M30 140 Q 10 115 10 90" stroke="var(--espresso)" stroke-width="1" opacity="0.4"/>
        </g>
        <g class="dancing-leaf leaf-2">
          <path d="M30 85 C 50 60, 45 30, 25 20 C 20 45, 25 70, 30 85" fill="var(--camel)" opacity="0.4"/>
          <path d="M30 85 Q 32 50 25 20" stroke="var(--espresso)" stroke-width="1" opacity="0.4"/>
        </g>
        <g class="dancing-leaf leaf-3">
          <path d="M115 65 C 135 45, 130 20, 110 15 C 105 35, 110 55, 115 65" fill="var(--cocoa)" opacity="0.35"/>
        </g>
        <g class="dancing-leaf leaf-4">
          <path d="M90 190 C 115 185, 130 165, 125 145 C 105 155, 95 175, 90 190" fill="var(--camel)" opacity="0.38"/>
        </g>
      </svg>
    </div>

    <!-- Bottom Right Winding Vine & Stem -->
    <div class="stem-container stem-bottom-right">
      <svg viewBox="0 0 180 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M190 230 C 150 170, 120 120, 140 60 C 150 30, 120 10, 80 20" stroke="var(--espresso)" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
        <path d="M140 135 C 95 145, 60 125, 30 140" stroke="var(--espresso)" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>

        <g class="dancing-leaf leaf-1">
          <path d="M140 135 C 170 120, 175 90, 155 80 C 145 100, 142 120, 140 135" fill="var(--cocoa)" opacity="0.38"/>
        </g>
        <g class="dancing-leaf leaf-2">
          <path d="M140 60 C 115 45, 110 15, 130 5 C 138 25, 138 45, 140 60" fill="var(--camel)" opacity="0.4"/>
        </g>
        <g class="dancing-leaf leaf-3">
          <path d="M30 140 C 10 125, 5 100, 20 90 C 30 105, 28 125, 30 140" fill="var(--cocoa)" opacity="0.32"/>
        </g>
        <g class="dancing-leaf leaf-4">
          <path d="M80 20 C 60 5, 35 15, 30 35 C 50 35, 70 30, 80 20" fill="var(--camel)" opacity="0.35"/>
        </g>
      </svg>
    </div>

    <!-- Main Monogram Content -->
    <div class="emblem">
      <!--
        Drop your monogram image in the same folder as this file and
        point the src at it. Use a PNG with a transparent background
        so it sits cleanly on the tan page color.
      -->
      <img class="emblem-image" src="invbg.png" alt="Harold and Myca monogram">
    </div>

    

    <div class="divider"></div>

    <div class="tap-hint">
      <svg class="play-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 5.14v13.72c0 .84.93 1.35 1.64.9l10.58-6.86a1.06 1.06 0 0 0 0-1.8L9.64 4.24C8.93 3.79 8 4.3 8 5.14z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
      </svg>
      <span class="tap-text">Tap to continue</span>
    </div>
  </div>

  <!-- Hidden YouTube player used as the background music source -->
  <div id="yt-player" class="yt-player-hidden"></div>

  <!-- Sound toggle, shown only if autoplay had to start muted -->
  <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Turn sound on">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/>
      <path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    </svg>
    <span>Tap for sound</span>
  </button>

  <!-- Loads the YouTube IFrame API, which calls onYouTubeIframeAPIReady() once ready -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="leaves.js"></script>
  <script src="script.js"></script>
</body>
</html>
